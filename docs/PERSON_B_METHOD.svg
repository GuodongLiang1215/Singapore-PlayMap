<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Person B: grounded dialogue-to-plan pipeline</title>
<desc id="desc">Gemini interprets requests. Local rules maintain scoped constraints and retrieve real POIs. Optional candidate selection precedes user confirmation. The browser applies state and invokes the existing planner. Adopted state feeds the next turn. New C alternative-search APIs are not integrated.</desc>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="50" y="35" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#3562bc">PERSON B  /  AI METHOD</text>
<text x="50" y="65" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#172b4d">From multi-turn requests to grounded planning proposals</text>
<text x="50" y="113" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#57657a">Gemini proposes meaning and choices; local code controls state and execution.</text>
<rect x="50" y="159" width="985" height="59" rx="16" fill="#edf1f7" stroke="none"/>
<text x="70" y="171" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#344054">INPUT   User message + adopted Draft / Preferences + unadopted Pending</text>
