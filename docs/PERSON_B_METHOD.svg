<text x="74" y="594" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">Stage2B computes routes and time</text>
<text x="74" y="622" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">Only matched evidence can verify</text>
<text x="74" y="650" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">Understanding is not satisfaction</text>
