<rect x="50" y="770" width="1500" height="87" rx="16" fill="#edf1f7" stroke="none"/>
<text x="72" y="783" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#344054">GUARDRAILS</text>
<text x="260" y="783" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#344054">Invalid or incomplete proposals do not overwrite the adopted itinerary.</text>
<text x="72" y="818" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#344054">BOUNDARIES</text>
<text x="260" y="818" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#344054">No new C alternative-search loop; no F9 independent accuracy result yet.</text>
