<text x="1149" y="524" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d">SELECT CANDIDATES</text>
<text x="1149" y="558" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#3562bc">GEMINI  /  OPTIONAL CALL 2</text>
<text x="1104" y="594" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">Real options + per-slot preferences</text>
<text x="1104" y="622" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">Return existing candidate keys only</text>
<text x="1104" y="650" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">Local check for coverage / duplicates</text>
<rect x="565" y="506" width="470" height="178" rx="16" fill="#ffffff" stroke="#d9e1ec"/>
<rect x="583" y="524" width="39" height="34" rx="9" fill="#fff1db" stroke="none"/>
<text x="595" y="527" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#b46b10">5</text>
<text x="634" y="524" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d">PREVIEW &amp; CONFIRM</text>
<text x="634" y="558" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#b46b10">USER + LOCAL RESOLVE</text>
<text x="589" y="594" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">Show options, requirements, conflicts</text>
<text x="589" y="622" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">User chooses; resolve checks ticket</text>
<text x="589" y="650" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">Browser applies Draft + Preferences</text>
<rect x="50" y="506" width="470" height="178" rx="16" fill="#ffffff" stroke="#d9e1ec"/>
<rect x="68" y="524" width="39" height="34" rx="9" fill="#edf1f7" stroke="none"/>
