<polygon points="1315.0,255.0 1312.2,249.1 1317.8,249.1" fill="#318467"/>
<rect x="50" y="255" width="470" height="178" rx="16" fill="#ffffff" stroke="#d9e1ec"/>
<rect x="68" y="273" width="39" height="34" rx="9" fill="#e8efff" stroke="none"/>
<text x="80" y="276" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#3562bc">1</text>
<text x="119" y="273" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d">INTERPRET</text>
<text x="119" y="307" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#3562bc">GEMINI  /  CALL 1</text>
<text x="74" y="343" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">Intent segments + typed commands</text>
<text x="74" y="371" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">Scope, hardness, source and quote</text>
<text x="74" y="399" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">No coordinates or verified claims</text>
<rect x="565" y="255" width="470" height="178" rx="16" fill="#ffffff" stroke="#d9e1ec"/>
<rect x="583" y="273" width="39" height="34" rx="9" fill="#e8f5ef" stroke="none"/>
<text x="595" y="276" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#318467">2</text>
<text x="634" y="273" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d">VALIDATE &amp; REMEMBER</text>
<text x="634" y="307" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#318467">LOCAL  /  PROPOSAL COPY</text>
<text x="589" y="343" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">Schema, quote and command checks</text>
<text x="589" y="371" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">Bind positions to stable visit IDs</text>
<text x="589" y="399" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">Merge constraints deterministically</text>
<rect x="1080" y="255" width="470" height="178" rx="16" fill="#ffffff" stroke="#d9e1ec"/>
<rect x="1098" y="273" width="39" height="34" rx="9" fill="#e8f5ef" stroke="none"/>
<text x="1110" y="276" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#318467">3</text>
<text x="1149" y="273" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d">RETRIEVE POIs</text>
<text x="1149" y="307" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#318467">LOCAL  /  ONE SLOT PER OPERATION</text>
<text x="1104" y="343" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">Type evidence + text + exclusions</text>
<text x="1104" y="371" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">Straight-line radius when specified</text>
<text x="1104" y="399" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#25344d">Rank; 8 local options, up to 12 total</text>
