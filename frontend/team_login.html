<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Singapore PlayMap · Team Access</title>
<style>body{margin:0;background:#f4f7f4;color:#19372f;font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.card{max-width:430px;margin:10vh auto;background:#fff;border:1px solid #d9e2dc;border-radius:14px;padding:28px;box-shadow:0 10px 35px rgba(20,50,40,.08)}h1{font-size:24px;margin:0 0 8px}.small{font-size:12px;color:#5e706a}label{display:block;font-weight:650;margin:18px 0 6px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd7ce;border-radius:7px;font:inherit}button{width:100%;margin-top:14px;padding:11px;border:0;border-radius:7px;background:#1d6854;color:#fff;font:inherit;font-weight:700;cursor:pointer}#status{min-height:25px;color:#9a382f;margin-top:12px}</style></head><body><main class="card"><h1>Singapore PlayMap</h1><p>This is a team preview. Enter the shared access code to continue. API keys stay on the server.</p><form id="form"><label for="code">Team access code</label><input id="code" type="password" minlength="8" maxlength="256" autocomplete="current-password" required><button type="submit">Open PlayMap</button></form><p id="status" role="status"></p><p class="small">The access code protects the course test instance and its shared Gemini / OneMap quota.</p></main><script>
const form=document.getElementById('form'),status=document.getElementById('status');form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Checking access…';try{const r=await fetch('/api/access/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value})});if(!r.ok){status.textContent='Incorrect access code or service unavailable.';return;}location.replace('/map');}catch{status.textContent='Cannot connect to the service. Try again later.';}});
</script></body></html>
